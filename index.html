<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quiz delle regioni</title>
<style>
  :root{--bg:#0f1a33;--card:#17264a;--ink:#f4efe2;--mut:#b9c3dd;--acc:#ffd36b;--ok:#5fd39a;--no:#ff8a7a}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:system-ui,"Segoe UI",sans-serif;color:var(--ink);
    background:radial-gradient(ellipse at 50% -10%,#24407a 0,var(--bg) 60%);display:flex;align-items:center;justify-content:center;padding:20px}
  main{width:100%;max-width:560px;background:var(--card);border-radius:20px;padding:28px 26px;box-shadow:0 20px 60px #0008}
  h1{margin:0 0 4px;font-size:1.7rem}
  .sub{color:var(--mut);margin:0 0 22px}
  .bar{display:flex;justify-content:space-between;color:var(--mut);font-size:.95rem;margin-bottom:10px}
  .q{font-size:1.35rem;margin:6px 0 18px;line-height:1.35}
  .opts{display:grid;gap:10px}
  button.o{font:inherit;font-size:1.1rem;text-align:left;padding:14px 16px;border-radius:12px;border:2px solid #2f4478;background:#1d2f5a;color:var(--ink);cursor:pointer}
  button.o:hover{border-color:var(--acc)}
  button.o.ok{background:#1f5a44;border-color:var(--ok)}
  button.o.no{background:#5a2626;border-color:var(--no)}
  .tempo{height:6px;border-radius:3px;background:#2f4478;overflow:hidden;margin-bottom:16px}
  .tempo i{display:block;height:100%;background:var(--acc);width:100%;transition:width 1s linear}
  .msg{min-height:1.6em;margin-top:14px;color:var(--mut)}
  .go{font:inherit;font-size:1.1rem;margin-top:16px;padding:12px 22px;border:0;border-radius:12px;background:var(--acc);color:#1b1b1b;font-weight:700;cursor:pointer}
  .fine{text-align:center}
  body.calma{background:#1e2a3a}
  body.calma .q{font-size:1.6rem}
  body.calma button.o{font-size:1.3rem;padding:18px}
  body.calma .tempo{display:none}
  label.calma{display:flex;gap:8px;align-items:center;margin-top:14px;color:var(--mut)}
  label.calma input{width:20px;height:20px}
  .fine b{font-size:3rem;color:var(--acc);display:block;margin:10px 0}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DOMANDE=[
  ["Qual è il capoluogo del Piemonte?","Torino",["Novara","Cuneo","Alessandria"]],
  ["Qual è il capoluogo della Puglia?","Bari",["Lecce","Foggia","Taranto"]],
  ["Qual è il capoluogo dell'Umbria?","Perugia",["Terni","Assisi","Spoleto"]],
  ["Qual è il capoluogo della Calabria?","Catanzaro",["Reggio Calabria","Cosenza","Crotone"]],
  ["Qual è il capoluogo del Trentino-Alto Adige?","Trento",["Bolzano","Rovereto","Merano"]],
  ["Qual è il capoluogo delle Marche?","Ancona",["Pesaro","Macerata","Ascoli Piceno"]],
  ["Qual è il capoluogo della Basilicata?","Potenza",["Matera","Melfi","Policoro"]],
  ["Qual è il capoluogo del Friuli-Venezia Giulia?","Trieste",["Udine","Pordenone","Gorizia"]]
];
const SECONDI=20;
const app=document.getElementById("app");
let ordine,n,punti,timer,resta,calma=false;
const mescola=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function inizio(){
  app.innerHTML=`<h1>Quiz delle regioni</h1><p class="sub">Otto domande sui capoluoghi di regione. Hai ${SECONDI} secondi per ogni domanda, oppure scegli la modalità calma.</p><button class="go" id="via">Comincia</button><label class="calma"><input type="checkbox" id="calma"> Modalità calma: senza tempo, testo più grande</label>`;
  const c=document.getElementById("calma");c.checked=calma;c.onchange=()=>{calma=c.checked;document.body.classList.toggle("calma",calma)};
  document.getElementById("via").onclick=()=>{ordine=mescola(DOMANDE);n=0;punti=0;domanda()};
}
function domanda(){
  const [testo,giusta,altre]=ordine[n];
  const opzioni=mescola([giusta,...altre]);
  app.innerHTML=`<div class="bar"><span>Domanda ${n+1} di ${ordine.length}</span><span>Punti: ${punti}</span></div>
    <div class="tempo"><i id="t"></i></div><p class="q">${testo}</p>
    <div class="opts">${opzioni.map(o=>`<button class="o">${o}</button>`).join("")}</div><p class="msg" id="m"></p>`;
  const bottoni=[...app.querySelectorAll("button.o")];
  resta=SECONDI;const t=document.getElementById("t");
  clearInterval(timer);if(!calma)timer=setInterval(()=>{resta--;t.style.width=(resta/SECONDI*100)+"%";if(resta<=0)rispondi(null)},1000);
  function rispondi(b){
    clearInterval(timer);bottoni.forEach(x=>{x.disabled=true;if(x.textContent===giusta)x.classList.add("ok")});
    const m=document.getElementById("m");
    if(b&&b.textContent===giusta){punti++;m.textContent="Giusto!"}
    else{if(b)b.classList.add("no");m.textContent=(b?"Non è così: ":"Tempo scaduto: ")+"la risposta è "+giusta+"."}
    setTimeout(()=>{n++;n<ordine.length?domanda():fine()},1600);
  }
  bottoni.forEach(b=>b.onclick=()=>rispondi(b));
}
function fine(){
  app.innerHTML=`<div class="fine"><h1>Fine del quiz</h1><b>${punti} / ${ordine.length}</b><p class="sub">${punti>=6?"Bravissima, bravissimo!":"Riprova: la seconda volta va meglio."}</p><button class="go" id="via">Gioca ancora</button></div>`;
  document.getElementById("via").onclick=()=>{ordine=mescola(DOMANDE);n=0;punti=0;domanda()};
}
inizio();
</script>
</body>
</html>
